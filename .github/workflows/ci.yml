name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Classify changes
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
    steps:
      - name: Check out source history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Classify changed files
        id: classify
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail

          docs_only=true
          found_change=false
          if [[ -z "${BASE_SHA}" ||
                "${BASE_SHA}" == "0000000000000000000000000000000000000000" ]] ||
             ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            docs_only=false
          else
            while IFS= read -r -d '' path; do
              found_change=true
              case "${path}" in
                docs/*|README.md|CODE_OF_CONDUCT.md|CONTRIBUTING.md|DESIGN.md|PRODUCT.md|SECURITY.md|SUPPORT.md)
                  ;;
                *)
                  docs_only=false
                  ;;
              esac
            done < <(git diff --name-only --diff-filter=ACDMRTUXB -z "${BASE_SHA}" "${HEAD_SHA}")
          fi

          if [[ "${found_change}" != "true" ]]; then
            docs_only=false
          fi
          echo "docs_only=${docs_only}" >> "$GITHUB_OUTPUT"

  validate:
    name: ${{ matrix.name }}
    if: always()
    needs:
      - changes
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Workflow policy
            command: npm run ci:workflows
          - name: Impeccable integration
            command: npm run impeccable:validate
          - name: Lint
            command: npm run lint
          - name: Worker runtime
            command: npm run test:worker-runtime
          - name: Production build
            command: npm run build
    steps:
      - name: Skip expensive validation for documentation-only changes
        if: needs.changes.outputs.docs_only == 'true'
        run: echo "${{ matrix.name }} is not required for documentation-only changes."

      - name: Check out source
        if: needs.changes.outputs.docs_only != 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
           persist-credentials: false

      - name: Set up Node.js
        if: needs.changes.outputs.docs_only != 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Restore npm download cache
        if: needs.changes.outputs.docs_only != 'true'
        id: npm-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            npm-${{ runner.os }}-${{ runner.arch }}-

      - name: Install dependencies
        if: needs.changes.outputs.docs_only != 'true'
        run: npm ci --no-audit --no-fund

      - name: Run ${{ matrix.name }}
        if: >-
          needs.changes.outputs.docs_only != 'true' &&
          matrix.name != 'Production build'
        run: ${{ matrix.command }}

      - name: Run Production build
        if: >-
          needs.changes.outputs.docs_only != 'true' &&
          matrix.name == 'Production build'
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: ${{ matrix.command }}

      - name: Save npm download cache
        if: >-
          needs.changes.outputs.docs_only != 'true' &&
          github.ref == 'refs/heads/main' &&
          matrix.name == 'Workflow policy' &&
          steps.npm-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.npm
          key: ${{ steps.npm-cache.outputs.cache-primary-key }}

  unit-test-shards:
    name: Unit tests (${{ matrix.shard }}/4)
    if: always()
    needs:
      - changes
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Skip unit-test shard for documentation-only changes
        if: needs.changes.outputs.docs_only == 'true'
        run: echo "Unit-test shard ${{ matrix.shard }}/4 is not required for documentation-only changes."

      - name: Check out source
        if: needs.changes.outputs.docs_only != 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
         persist-credentials: false

      - name: Set up Node.js
        if: needs.changes.outputs.docs_only != 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
         node-version: 22

      - name: Restore npm download cache
        if: needs.changes.outputs.docs_only != 'true'
        id: npm-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
         path: ~/.npm
         key: npm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}
         restore-keys: |
           npm-${{ runner.os }}-${{ runner.arch }}-

      - name: Install dependencies
        if: needs.changes.outputs.docs_only != 'true'
        run: npm ci --no-audit --no-fund

      - name: Run unit-test shard
        if: needs.changes.outputs.docs_only != 'true'
        run: npm test -- --shard=${{ matrix.shard }}/4

  unit-tests:
    name: Unit tests
    if: always()
    needs:
      - unit-test-shards
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Confirm all unit-test shards passed
        env:
          SHARD_RESULT: ${{ needs.unit-test-shards.result }}
        run: test "${SHARD_RESULT}" = "success"
