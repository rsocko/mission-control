name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Workflow policy
            command: npm run ci:workflows
          - name: Impeccable integration
            command: npm run impeccable:validate
          - name: Lint
            command: npm run lint
          - name: Worker runtime
            command: npm run test:worker-runtime
          - name: Production build
            command: npm run build
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
           persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
           node-version: 22
           cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run ${{ matrix.name }}
        if: matrix.name != 'Production build'
        run: ${{ matrix.command }}

      - name: Run Production build
        if: matrix.name == 'Production build'
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: ${{ matrix.command }}

  unit-test-shards:
    name: Unit tests (${{ matrix.shard }}/4)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
         persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
         node-version: 22
         cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run unit-test shard
        run: npm test -- --shard=${{ matrix.shard }}/4

  unit-tests:
    name: Unit tests
    if: always()
    needs:
      - unit-test-shards
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Confirm all unit-test shards passed
        env:
          SHARD_RESULT: ${{ needs.unit-test-shards.result }}
        run: test "${SHARD_RESULT}" = "success"
