name: Publish container

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
  workflow_dispatch:
    inputs:
      commit:
        description: Full commit SHA from the main branch history to publish
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-container-${{ github.event.workflow_run.head_sha || inputs.commit }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Verify publication source
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.id == github.event.repository.id) ||
      (github.event_name == 'workflow_dispatch' &&
       github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
    steps:
      - name: Check out main history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: main

      - name: Select and verify source commit
        id: source
        env:
          AUTOMATIC_SHA: ${{ github.event.workflow_run.head_sha }}
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_SHA: ${{ inputs.commit }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${EVENT_NAME}" == "workflow_run" ]]; then
            source_sha="${AUTOMATIC_SHA}"
          else
            source_sha="${MANUAL_SHA}"
          fi

          if [[ ! "${source_sha}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Publication requires a full lowercase commit SHA"
            exit 1
          fi

          trusted_main_sha="$(git rev-parse HEAD)"
          git cat-file -e "${source_sha}^{commit}"
          if ! git merge-base --is-ancestor "${source_sha}" "${trusted_main_sha}"; then
            echo "::error::Commit is not in the checked-out main history"
            exit 1
          fi

          echo "sha=${source_sha}" >> "$GITHUB_OUTPUT"

  publish:
    name: Build, publish, and attest
    needs:
      - prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write
    env:
      SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
    outputs:
      digest: ${{ steps.publish.outputs.digest }}
      image: ${{ steps.image.outputs.name }}
    steps:
      - name: Check out current main history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: main

      - name: Reverify main ancestry and select exact source
        shell: bash
        run: |
          set -euo pipefail

          trusted_main_sha="$(git rev-parse HEAD)"
          git cat-file -e "${SOURCE_SHA}^{commit}"
          if ! git merge-base --is-ancestor "${SOURCE_SHA}" "${trusted_main_sha}"; then
            echo "::error::Verified commit is no longer in the checked-out main history"
            exit 1
          fi

          git checkout --detach "${SOURCE_SHA}"
          actual_sha="$(git rev-parse HEAD)"
          if [[ "${actual_sha}" != "${SOURCE_SHA}" ]]; then
            echo "::error::Checked out ${actual_sha}, expected ${SOURCE_SHA}"
            exit 1
          fi

      - name: Select image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ github.token }}
        shell: bash
        run: echo "${GHCR_TOKEN}" | docker login ghcr.io --username "${GITHUB_ACTOR}" --password-stdin

      - name: Create isolated Buildx builder
        shell: bash
        run: docker buildx create --driver docker-container --use

      - name: Build and publish digest-oriented image
        id: publish
        env:
          IMAGE: ${{ steps.image.outputs.name }}
        shell: bash
        run: |
          set -euo pipefail
          metadata_file="${RUNNER_TEMP}/build-metadata.json"

          docker buildx build \
            --file Dockerfile \
            --platform linux/amd64 \
            --build-arg "MC_BUILD_SHA=${SOURCE_SHA}" \
            --build-arg "MC_DEPLOYMENT_REVISION=sha-${SOURCE_SHA}" \
            --label "org.opencontainers.image.revision=${SOURCE_SHA}" \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --attest type=sbom \
            --provenance=false \
            --metadata-file "${metadata_file}" \
            --output "type=image,name=${IMAGE},push-by-digest=true,name-canonical=true,push=true" \
            .

          digest="$(jq -er '."containerimage.digest" | select(test("^sha256:[0-9a-f]{64}$"))' "${metadata_file}")"
          echo "Published ${IMAGE}@${digest}"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Attest build provenance
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.publish.outputs.digest }}
          push-to-registry: true

      - name: Log out of GHCR
        if: ${{ always() }}
        run: docker logout ghcr.io
