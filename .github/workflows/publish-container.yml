name: Publish container

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-container-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build, publish, and attest
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write
    outputs:
      digest: ${{ steps.publish.outputs.digest }}
      image: ${{ steps.image.outputs.name }}
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Select image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ github.token }}
        shell: bash
        run: echo "${GHCR_TOKEN}" | docker login ghcr.io --username "${{ github.actor }}" --password-stdin

      - name: Create isolated Buildx builder
        shell: bash
        run: docker buildx create --driver docker-container --use

      - name: Build and publish digest-oriented image
        id: publish
        env:
          IMAGE: ${{ steps.image.outputs.name }}
        shell: bash
        run: |
          metadata_file="${RUNNER_TEMP}/build-metadata.json"

          docker buildx build \
            --file Dockerfile \
            --platform linux/amd64 \
            --build-arg "MC_BUILD_SHA=${GITHUB_SHA}" \
            --build-arg "MC_DEPLOYMENT_REVISION=sha-${GITHUB_SHA}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --attest type=sbom \
            --provenance=false \
            --metadata-file "${metadata_file}" \
            --output "type=image,name=${IMAGE},push-by-digest=true,name-canonical=true,push=true" \
            .

          digest="$(jq -er '."containerimage.digest" | select(test("^sha256:[0-9a-f]{64}$"))' "${metadata_file}")"
          echo "Published ${IMAGE}@${digest}"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.publish.outputs.digest }}
          push-to-registry: true

      - name: Log out of GHCR
        if: ${{ always() }}
        run: docker logout ghcr.io
