name: Publish container

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
  workflow_dispatch:
    inputs:
      commit:
        description: Full commit SHA from the main branch history to publish
        required: true
        type: string
      version_mode:
        description: How to determine the immutable image tag
        required: true
        type: choice
        default: next_patch
        options:
          - explicit
          - next_major
          - next_minor
          - next_patch
      image_tag:
        description: Explicit image tag when version_mode=explicit
        required: false
        default: ""
        type: string
      push_latest:
        description: Also promote the image to latest
        required: true
        type: choice
        default: "true"
        options:
          - "false"
          - "true"

permissions:
  contents: read

concurrency:
  group: publish-container
  cancel-in-progress: false

jobs:
  prepare:
    name: Verify publication source
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.id == github.event.repository.id) ||
      (github.event_name == 'workflow_dispatch' &&
       github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
    steps:
      - name: Check out main history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: main

      - name: Select and verify source commit
        id: source
        env:
          AUTOMATIC_SHA: ${{ github.event.workflow_run.head_sha }}
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_SHA: ${{ inputs.commit }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${EVENT_NAME}" == "workflow_run" ]]; then
            source_sha="${AUTOMATIC_SHA}"
          else
            source_sha="${MANUAL_SHA}"
          fi

          if [[ ! "${source_sha}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Publication requires a full lowercase commit SHA"
            exit 1
          fi

          trusted_main_sha="$(git rev-parse HEAD)"
          git cat-file -e "${source_sha}^{commit}"
          if ! git merge-base --is-ancestor "${source_sha}" "${trusted_main_sha}"; then
            echo "::error::Commit is not in the checked-out main history"
            exit 1
          fi

          echo "sha=${source_sha}" >> "$GITHUB_OUTPUT"

  publish:
    name: Build, publish, and attest
    needs:
      - prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      actions: read
      attestations: write
      contents: read
      id-token: write
      packages: write
    env:
      BUILDKIT_CACHE_SCOPE: mission-control-app-v1
      SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
    outputs:
      digest: ${{ steps.publish.outputs.digest }}
      image: ${{ steps.image.outputs.name }}
      version_tag: ${{ steps.tags.outputs.resolved_tag }}
      sha_tag: ${{ steps.tags.outputs.sha_tag }}
    steps:
      - name: Check out current main history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: main

      - name: Reverify main ancestry and select exact source
        shell: bash
        run: |
          set -euo pipefail

          trusted_main_sha="$(git rev-parse HEAD)"
          git cat-file -e "${SOURCE_SHA}^{commit}"
          if ! git merge-base --is-ancestor "${SOURCE_SHA}" "${trusted_main_sha}"; then
            echo "::error::Verified commit is no longer in the checked-out main history"
            exit 1
          fi

          git checkout --detach "${SOURCE_SHA}"
          actual_sha="$(git rev-parse HEAD)"
          if [[ "${actual_sha}" != "${SOURCE_SHA}" ]]; then
            echo "::error::Checked out ${actual_sha}, expected ${SOURCE_SHA}"
            exit 1
          fi

      - name: Select image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ github.token }}
        shell: bash
        run: echo "${GHCR_TOKEN}" | docker login ghcr.io --username "${GITHUB_ACTOR}" --password-stdin

      - name: Resolve immutable publication tags
        id: tags
        env:
          EVENT_NAME: ${{ github.event_name }}
          EXPLICIT_TAG: ${{ inputs.image_tag }}
          REGISTRY_PASSWORD: ${{ github.token }}
          REGISTRY_REPOSITORY: ${{ steps.image.outputs.name }}
          REGISTRY_USERNAME: ${{ github.actor }}
          REQUESTED_MODE: ${{ inputs.version_mode }}
          REQUESTED_PUSH_LATEST: ${{ inputs.push_latest }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${EVENT_NAME}" == "workflow_run" ]]; then
            export VERSION_MODE="next_patch"
            push_latest="true"
            sha_tag="sha-${SOURCE_SHA:0:7}"
          else
            export VERSION_MODE="${REQUESTED_MODE}"
            push_latest="${REQUESTED_PUSH_LATEST}"
            sha_tag=""
          fi

          python3 .github/scripts/resolve_registry_version.py
          echo "sha_tag=${sha_tag}" >> "$GITHUB_OUTPUT"
          echo "push_latest=${push_latest}" >> "$GITHUB_OUTPUT"

      - name: Reject immutable tag overwrite
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          SHA_TAG: ${{ steps.tags.outputs.sha_tag }}
          VERSION_TAG: ${{ steps.tags.outputs.resolved_tag }}
        shell: bash
        run: |
          set -euo pipefail

          require_absent() {
            local reference="$1"
            local output=""
            for attempt in 1 2 3; do
              if output="$(docker manifest inspect "${reference}" 2>&1)"; then
                echo "::error::Immutable image tag already exists: ${reference}"
                return 1
              fi
              if grep -Eqi 'manifest unknown|no such manifest|manifest.*not found' <<<"${output}"; then
                return 0
              fi
              sleep "${attempt}"
            done
            echo "::error::Could not prove immutable image tag is absent: ${reference}"
            return 1
          }

          require_absent "${IMAGE}:${VERSION_TAG}"
          if [[ -n "${SHA_TAG}" ]]; then
            require_absent "${IMAGE}:${SHA_TAG}"
          fi

      - name: Create isolated Buildx builder
        shell: bash
        run: docker buildx create --driver docker-container --use

      - name: Build and publish digest-oriented image
        id: publish
        env:
          IMAGE: ${{ steps.image.outputs.name }}
        shell: bash
        run: |
          set -euo pipefail
          metadata_file="${RUNNER_TEMP}/build-metadata.json"
          build_started_at="${SECONDS}"
          cache_status="gha-enabled"
          build_args=(
            --file Dockerfile
            --platform linux/amd64
            --build-arg "MC_BUILD_SHA=${SOURCE_SHA}"
            --build-arg "MC_DEPLOYMENT_REVISION=${{ steps.tags.outputs.resolved_tag }}"
            --label "org.opencontainers.image.revision=${SOURCE_SHA}"
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"
            --attest type=sbom
            --provenance=false
            --metadata-file "${metadata_file}"
            --output "type=image,name=${IMAGE},push-by-digest=true,name-canonical=true,push=true"
          )

          if ! docker buildx build \
            "${build_args[@]}" \
            --cache-from "type=gha,scope=${BUILDKIT_CACHE_SCOPE}" \
            --cache-to "type=gha,scope=${BUILDKIT_CACHE_SCOPE},mode=max,ignore-error=true" \
            .
          then
            echo "::warning::BuildKit cache was unavailable; retrying a cold build"
            cache_status="cold-fallback"
            rm -f "${metadata_file}"
            docker buildx build "${build_args[@]}" .
          fi

          digest="$(jq -er '."containerimage.digest" | select(test("^sha256:[0-9a-f]{64}$"))' "${metadata_file}")"
          build_duration="$((SECONDS - build_started_at))"
          echo "Published ${IMAGE}@${digest}"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          echo "build_duration_seconds=${build_duration}" >> "$GITHUB_OUTPUT"
          echo "cache_status=${cache_status}" >> "$GITHUB_OUTPUT"

      - name: Measure Actions cache usage
        id: cache-usage
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          usage="$(gh api "repos/${GITHUB_REPOSITORY}/actions/cache/usage")"
          bytes="$(jq -er '.active_caches_size_in_bytes' <<<"${usage}")"
          count="$(jq -er '.active_caches_count' <<<"${usage}")"
          gib="$(awk -v bytes="${bytes}" 'BEGIN { printf "%.2f", bytes / 1073741824 }')"
          echo "count=${count}" >> "$GITHUB_OUTPUT"
          echo "gib=${gib}" >> "$GITHUB_OUTPUT"
          echo "Actions cache usage after build: ${gib} GiB across ${count} entries"

      - name: Attest build provenance
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.publish.outputs.digest }}
          push-to-registry: true

      - name: Promote attested digest to requested tags
        env:
          DIGEST: ${{ steps.publish.outputs.digest }}
          IMAGE: ${{ steps.image.outputs.name }}
          PUSH_LATEST: ${{ steps.tags.outputs.push_latest }}
          SHA_TAG: ${{ steps.tags.outputs.sha_tag }}
          VERSION_TAG: ${{ steps.tags.outputs.resolved_tag }}
        shell: bash
        run: |
          set -euo pipefail

          require_absent() {
            local reference="$1"
            local output=""
            for attempt in 1 2 3; do
              if output="$(docker manifest inspect "${reference}" 2>&1)"; then
                echo "::error::Immutable image tag appeared before promotion: ${reference}"
                return 1
              fi
              if grep -Eqi 'manifest unknown|no such manifest|manifest.*not found' <<<"${output}"; then
                return 0
              fi
              sleep "${attempt}"
            done
            echo "::error::Could not prove immutable image tag is absent: ${reference}"
            return 1
          }

          verify_digest() {
            local reference="$1"
            local promoted_digest
            promoted_digest="$(
              docker buildx imagetools inspect "${reference}" \
                --format '{{.Manifest.Digest}}'
            )"
            if [[ "${promoted_digest}" != "${DIGEST}" ]]; then
              echo "::error::${reference} resolved to ${promoted_digest}, expected ${DIGEST}"
              return 1
            fi
          }

          version_ref="${IMAGE}:${VERSION_TAG}"
          require_absent "${version_ref}"
          promotion_args=(--tag "${version_ref}")
          verification_refs=("${version_ref}")

          if [[ -n "${SHA_TAG}" ]]; then
            sha_ref="${IMAGE}:${SHA_TAG}"
            require_absent "${sha_ref}"
            promotion_args+=(--tag "${sha_ref}")
            verification_refs+=("${sha_ref}")
          fi
          if [[ "${PUSH_LATEST}" == "true" ]]; then
            latest_ref="${IMAGE}:latest"
            promotion_args+=(--tag "${latest_ref}")
            verification_refs+=("${latest_ref}")
          fi

          docker buildx imagetools create \
            "${promotion_args[@]}" \
            "${IMAGE}@${DIGEST}"

          for reference in "${verification_refs[@]}"; do
            verify_digest "${reference}"
          done

      - name: Publish image summary
        env:
          BUILD_DURATION_SECONDS: ${{ steps.publish.outputs.build_duration_seconds }}
          CACHE_COUNT: ${{ steps.cache-usage.outputs.count }}
          CACHE_STATUS: ${{ steps.publish.outputs.cache_status }}
          CACHE_USAGE_GIB: ${{ steps.cache-usage.outputs.gib }}
          DIGEST: ${{ steps.publish.outputs.digest }}
          IMAGE: ${{ steps.image.outputs.name }}
          PUSH_LATEST: ${{ steps.tags.outputs.push_latest }}
          SHA_TAG: ${{ steps.tags.outputs.sha_tag }}
          VERSION_TAG: ${{ steps.tags.outputs.resolved_tag }}
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "## Mission Control container"
            echo
            echo "Digest: \`${IMAGE}@${DIGEST}\`"
            echo
            echo "Immutable version: \`${IMAGE}:${VERSION_TAG}\`"
            echo
            echo "Build cache: \`${BUILDKIT_CACHE_SCOPE}\` (\`mode=max\`, ${CACHE_STATUS})"
            echo
            echo "Build duration: ${BUILD_DURATION_SECONDS} seconds"
            if [[ -n "${CACHE_USAGE_GIB}" ]]; then
              echo
              echo "Actions cache usage: ${CACHE_USAGE_GIB} GiB across ${CACHE_COUNT} entries"
            fi
            if [[ -n "${SHA_TAG}" ]]; then
              echo
              echo "Immutable source: \`${IMAGE}:${SHA_TAG}\`"
            fi
            if [[ "${PUSH_LATEST}" == "true" ]]; then
              echo
              echo "Active development: \`${IMAGE}:latest\`"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Log out of GHCR
        if: ${{ always() }}
        run: docker logout ghcr.io
