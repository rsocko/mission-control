<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=360">
  <title>Mission Control</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      width: 340px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      -webkit-font-smoothing: antialiased;
    }

    /* ─── Header ─── */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      border-bottom: 1px solid #1e293b;
    }
    .header-left h1 {
      font-size: 14px;
      font-weight: 700;
      color: #f1f5f9;
      letter-spacing: -0.01em;
    }
    .header-actions {
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .settings-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 28px;
      height: 28px;
      border-radius: 6px;
      border: none;
      background: transparent;
      color: #94a3b8;
      cursor: pointer;
      transition: background-color 0.1s, color 0.1s;
    }
    .settings-btn:hover { background: #1e293b; color: #e2e8f0; }
    .settings-btn:focus-visible {
      outline: 2px solid #818cf8;
      outline-offset: 2px;
    }
    .settings-btn svg {
      width: 16px;
      height: 16px;
    }

    .content { padding: 14px 16px 16px; }

    /* ─── Setup / Config ─── */
    .view { display: none; }
    .view.visible { display: block; }

    .field { margin-bottom: 10px; }
    .field label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      color: #94a3b8;
      margin-bottom: 4px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .field input {
      width: 100%;
      padding: 8px 10px;
      border-radius: 8px;
      border: 1px solid #334155;
      background: #1e293b;
      color: #e2e8f0;
      font-size: 12px;
      outline: none;
      transition: border-color 0.15s;
    }
    .field input:focus { border-color: #6366f1; }
    .field input::placeholder { color: #64748b; }

    .config-error {
      text-align: center;
      padding: 8px;
      font-size: 12px;
      font-weight: 500;
      border-radius: 8px;
      margin-top: 10px;
      background: #450a0a;
      color: #f87171;
      border: 1px solid #991b1b;
    }

    /* ─── Buttons ─── */
    .btn {
      width: 100%;
      padding: 10px;
      border-radius: 10px;
      border: none;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.1s, transform 0.1s;
    }
    .btn:active { transform: scale(0.97); }
    .btn:focus-visible {
      outline: 2px solid #818cf8;
      outline-offset: 2px;
    }

    .btn-primary { background: #6366f1; color: white; }
    .btn-primary:hover { background: #4f46e5; }
    .btn-primary:disabled {
      background: #334155;
      color: #64748b;
      cursor: not-allowed;
      transform: none;
    }

    /* ─── Import banner (shown on importable sites) ─── */
    .import-banner {
      padding: 12px;
      border-radius: 10px;
      background: #1e293b;
      border: 1px solid #334155;
      margin-bottom: 14px;
    }
    .import-banner-header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
    }
    .import-banner-icon { width: 20px; height: 20px; border-radius: 4px; }
    .import-banner-title {
      font-size: 13px;
      font-weight: 600;
      color: #f1f5f9;
    }
    .import-banner-desc {
      font-size: 11px;
      color: #94a3b8;
      margin-bottom: 10px;
      line-height: 1.4;
    }
    .import-banner .btn-import {
      width: 100%;
      padding: 9px;
      border-radius: 8px;
      border: none;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      background: #22c55e;
      color: #052e16;
      transition: background-color 0.1s, transform 0.1s;
    }
    .import-banner .btn-import:hover { background: #16a34a; }
    .import-banner .btn-import:active { transform: scale(0.97); }
    .import-banner .btn-import:disabled {
      background: #334155;
      color: #64748b;
      cursor: not-allowed;
      transform: none;
    }
    .import-banner .btn-import.btn-redirect-primary {
      background: #6366f1;
      color: white;
    }
    .import-banner .btn-import.btn-redirect-primary:hover {
      background: #4f46e5;
    }
    .import-banner .btn-import:focus-visible {
      outline: 2px solid #818cf8;
      outline-offset: 2px;
    }
    .import-status {
      font-size: 11px;
      color: #94a3b8;
      margin-top: 8px;
      text-align: center;
    }
    .import-status.error { color: #f87171; }
    .import-status.success { color: #4ade80; }

    /* ─── Divider ─── */
    .divider {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 14px 0;
    }
    .divider::before,
    .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: #1e293b;
    }
    .divider-text {
      font-size: 10px;
      font-weight: 600;
      color: #64748b;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    /* ─── Page capture card ─── */
    .capture-card {
      padding: 10px 12px;
      border-radius: 10px;
      background: #1e293b;
      border: 1px solid #334155;
    }
    .capture-card .page-title {
      font-size: 12px;
      font-weight: 600;
      color: #f1f5f9;
      line-height: 1.4;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .capture-card .page-url {
      font-size: 10px;
      color: #94a3b8;
      margin-top: 3px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .capture-card .note-field {
      width: 100%;
      padding: 7px 9px;
      border-radius: 6px;
      border: 1px solid #334155;
      background: #0f172a;
      color: #e2e8f0;
      font-size: 11px;
      resize: none;
      outline: none;
      font-family: inherit;
      margin-top: 8px;
      transition: border-color 0.15s;
    }
    .capture-card .note-field:focus { border-color: #6366f1; }
    .capture-card .note-field::placeholder { color: #64748b; }
    .capture-card .btn {
      margin-top: 8px;
      padding: 8px;
      font-size: 12px;
      border-radius: 8px;
    }

    .status {
      text-align: center;
      padding: 8px;
      font-size: 12px;
      font-weight: 500;
      border-radius: 8px;
      margin-top: 8px;
      display: none;
    }
    .status.success {
      display: block;
      background: #052e16;
      color: #4ade80;
      border: 1px solid #166534;
    }
    .status.error {
      display: block;
      background: #450a0a;
      color: #f87171;
      border: 1px solid #991b1b;
    }

    /* ─── Quick links ─── */
    .quick-links {
      margin-top: 14px;
      padding-top: 12px;
      border-top: 1px solid #1e293b;
    }
    .quick-links-header {
      font-size: 10px;
      font-weight: 600;
      color: #64748b;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 8px;
    }
    .quick-links-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .quick-links-grid.hidden { display: none; }
    .quick-links-toggle {
      display: flex;
      align-items: center;
      gap: 6px;
      width: 100%;
      padding: 8px 10px;
      border-radius: 8px;
      border: 1px solid #334155;
      background: #1e293b;
      color: #cbd5e1;
      font-size: 11px;
      font-weight: 500;
      cursor: pointer;
      transition: background-color 0.1s, border-color 0.1s;
    }
    .quick-links-toggle:hover { background: #334155; border-color: #475569; }
    .quick-links-toggle:focus-visible {
      outline: 2px solid #818cf8;
      outline-offset: 2px;
    }
    .toggle-icons { display: flex; gap: 3px; }
    .toggle-icon-mini { width: 14px; height: 14px; border-radius: 2px; }
    .toggle-label { flex: 1; text-align: left; }
    .toggle-arrow { font-size: 9px; color: #64748b; }
    .quick-links.collapsed .quick-links-grid { margin-top: 8px; }
    .quick-link {
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 5px 10px;
      border-radius: 6px;
      border: 1px solid #334155;
      background: #1e293b;
      color: #cbd5e1;
      font-size: 11px;
      font-weight: 500;
      cursor: pointer;
      transition: background-color 0.1s, color 0.1s, border-color 0.1s;
      text-decoration: none;
    }
    .quick-link:hover {
      background: #334155;
      color: #f1f5f9;
      border-color: #475569;
    }
    .quick-link:focus-visible {
      outline: 2px solid #818cf8;
      outline-offset: 2px;
    }
    .quick-link-icon { width: 14px; height: 14px; border-radius: 2px; }

    /* ─── Shortcut hint ─── */
    .shortcut-hint {
      text-align: center;
      font-size: 10px;
      color: #94a3b8;
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1px solid #1e293b;
    }
    .shortcut-hint kbd {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 3px;
      padding: 1px 4px;
      font-family: ui-monospace, monospace;
      font-size: 10px;
      color: #cbd5e1;
    }

    /* ─── Empty state ─── */
    .empty-state {
      text-align: center;
      padding: 16px 12px;
      color: #94a3b8;
      font-size: 12px;
      line-height: 1.5;
    }

    /* ─── Send Tabs view ─── */
    .tabs-view {
      max-height: 420px;
      display: flex;
      flex-direction: column;
    }
    .tabs-view-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }
    .tabs-view-header h2 {
      font-size: 13px;
      font-weight: 700;
      color: #f1f5f9;
    }
    .tabs-back-btn {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 4px 8px;
      border-radius: 6px;
      border: none;
      background: transparent;
      color: #94a3b8;
      font-size: 11px;
      cursor: pointer;
      transition: background-color 0.1s, color 0.1s;
    }
    .tabs-back-btn:hover { background: #1e293b; color: #e2e8f0; }
    .tabs-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
    }
    .tabs-select-all {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      color: #94a3b8;
      cursor: pointer;
    }
    .tabs-select-all input { accent-color: #6366f1; }
    .tabs-count {
      font-size: 11px;
      color: #64748b;
    }
    .tabs-list {
      flex: 1;
      overflow-y: auto;
      max-height: 220px;
      border: 1px solid #334155;
      border-radius: 8px;
      background: #1e293b;
    }
    .tab-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 7px 10px;
      border-bottom: 1px solid #1e293b;
      transition: background-color 0.1s;
    }
    .tab-item:last-child { border-bottom: none; }
    .tab-item:hover { background: #334155; }
    .tab-item input[type="checkbox"] { accent-color: #6366f1; flex-shrink: 0; }
    .tab-item-favicon {
      width: 14px;
      height: 14px;
      border-radius: 2px;
      flex-shrink: 0;
    }
    .tab-item-info {
      flex: 1;
      min-width: 0;
    }
    .tab-item-title {
      font-size: 11px;
      font-weight: 500;
      color: #e2e8f0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .tab-item-url {
      font-size: 9px;
      color: #64748b;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .tabs-options {
      margin-top: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .tabs-option-row {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 11px;
      color: #cbd5e1;
    }
    .tabs-option-row input[type="checkbox"] { accent-color: #6366f1; }
    .tabs-note-field {
      width: 100%;
      padding: 7px 9px;
      border-radius: 6px;
      border: 1px solid #334155;
      background: #0f172a;
      color: #e2e8f0;
      font-size: 11px;
      resize: none;
      outline: none;
      font-family: inherit;
      transition: border-color 0.15s;
    }
    .tabs-note-field:focus { border-color: #6366f1; }
    .tabs-note-field::placeholder { color: #64748b; }
    .tabs-send-btn {
      margin-top: 10px;
    }
    .tabs-status {
      text-align: center;
      padding: 8px;
      font-size: 12px;
      font-weight: 500;
      border-radius: 8px;
      margin-top: 8px;
      display: none;
    }
    .tabs-status.success {
      display: block;
      background: #052e16;
      color: #4ade80;
      border: 1px solid #166534;
    }
    .tabs-status.error {
      display: block;
      background: #450a0a;
      color: #f87171;
      border: 1px solid #991b1b;
    }

    /* ─── Send Tabs trigger button ─── */
    .send-tabs-trigger {
      width: 100%;
      margin-top: 12px;
      padding: 9px;
      border-radius: 8px;
      border: 1px solid #334155;
      background: #1e293b;
      color: #cbd5e1;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: background-color 0.1s, border-color 0.1s, color 0.1s;
    }
    .send-tabs-trigger:hover { background: #334155; border-color: #475569; color: #f1f5f9; }
    .send-tabs-trigger:focus-visible {
      outline: 2px solid #818cf8;
      outline-offset: 2px;
    }
    .send-tabs-trigger svg { width: 14px; height: 14px; }
  </style>
</head>
<body>
  <div class="header">
    <div class="header-left">
      <h1>Mission Control</h1>
    </div>
    <div class="header-actions">
      <button class="settings-btn" id="openMcBtn" title="Open Mission Control" aria-label="Open Mission Control" style="display:none;">
        <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>
          <polyline points="15 3 21 3 21 9"/>
          <line x1="10" y1="14" x2="21" y2="3"/>
        </svg>
      </button>
      <button class="settings-btn" id="settingsBtn" title="Settings" aria-label="Settings">
        <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/>
          <circle cx="12" cy="12" r="3"/>
        </svg>
      </button>
    </div>
  </div>

  <div class="content">
    <!-- Setup view -->
    <div id="setup" class="view">
      <div class="field">
        <label for="apiUrl">Mission Control URL</label>
        <input type="url" id="apiUrl" placeholder="http://localhost:3099" />
      </div>
      <div class="field">
        <label for="captureKey">Capture Key</label>
        <input type="password" id="captureKey" placeholder="Your MC_TRIAGE_CAPTURE_KEY" />
      </div>
      <button class="btn btn-primary" id="saveConfig">Save Configuration</button>
      <div class="config-error" id="configError" style="display:none;"></div>
    </div>

    <!-- Main view (dynamically rendered by popup.js) -->
    <div id="main" class="view">
      <div id="dynamicContent"></div>
      <div class="status" id="status"></div>
      <div class="shortcut-hint">
        Quick save: <kbd>Ctrl</kbd>+<kbd>Shift</kbd>+<kbd>S</kbd>
      </div>
    </div>

    <!-- Send Tabs view -->
    <div id="sendTabsView" class="view">
      <div class="tabs-view">
        <div class="tabs-view-header">
          <h2>Send Tabs to Triage</h2>
          <button class="tabs-back-btn" id="tabsBackBtn" type="button">
            <svg width="12" height="12" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
            Back
          </button>
        </div>
        <div class="tabs-toolbar">
          <label class="tabs-select-all">
            <input type="checkbox" id="tabsSelectAll" checked />
            Select all
          </label>
          <span class="tabs-count" id="tabsCount"></span>
        </div>
        <div class="tabs-list" id="tabsList"></div>
        <div class="tabs-options">
          <label class="tabs-option-row">
            <input type="checkbox" id="tabsCloseThem" checked />
            Close tabs after saving
          </label>
          <textarea class="tabs-note-field" id="tabsBatchNote" rows="1" placeholder="Batch note (optional, e.g. &quot;Research for project X&quot;)"></textarea>
        </div>
        <button class="btn btn-primary tabs-send-btn" id="tabsSendBtn">Send to Triage</button>
        <div class="tabs-status" id="tabsStatus"></div>
      </div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
