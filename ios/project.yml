name: MissionControl
options:
  minimumXcodeGenVersion: 2.44.1
  createIntermediateGroups: true
  xcodeVersion: "16.4"
  defaultConfig: Debug
  deploymentTarget:
    iOS: "17.0"
configs:
  Debug: debug
  Release: release
settings:
  base:
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    SWIFT_VERSION: "5.10"
    TARGETED_DEVICE_FAMILY: "1,2"
targets:
  MissionControl:
    type: application
    platform: iOS
    sources:
      - path: MissionControl
        excludes:
          - Info.plist
      - path: SharedCapture
    configFiles:
      Debug: Config/Debug.xcconfig
      Release: Config/Release.xcconfig
    settings:
      base:
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: MissionControl/Info.plist
        CODE_SIGN_ENTITLEMENTS: Config/MissionControl.entitlements
        MARKETING_VERSION: "0.1.0"
        PRODUCT_BUNDLE_IDENTIFIER: "$(MC_APP_BUNDLE_IDENTIFIER)"
        PRODUCT_NAME: MissionControl
    dependencies:
      - target: MissionControlShareExtension
    scheme:
      testTargets:
        - MissionControlTests
      gatherCoverageData: true
  MissionControlTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: MissionControlTests
    configFiles:
      Debug: Config/Debug.xcconfig
      Release: Config/Release.xcconfig
    dependencies:
      - target: MissionControl
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: "$(MC_APP_BUNDLE_IDENTIFIER).tests"
  MissionControlShareExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: ShareExtension
        excludes:
          - Info.plist
      - path: SharedCapture
    configFiles:
      Debug: Config/Debug.xcconfig
      Release: Config/Release.xcconfig
    settings:
      base:
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: ShareExtension/Info.plist
        CODE_SIGN_ENTITLEMENTS: Config/ShareExtension.entitlements
        MARKETING_VERSION: "0.1.0"
        PRODUCT_BUNDLE_IDENTIFIER: "$(MC_APP_BUNDLE_IDENTIFIER).share"
        PRODUCT_NAME: MissionControlShare
        PROVISIONING_PROFILE_SPECIFIER: "$(MC_SHARE_PROVISIONING_PROFILE_SPECIFIER)"
