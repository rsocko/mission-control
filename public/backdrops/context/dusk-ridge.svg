<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Abstract dusk mountain backdrop</title>
  <desc id="desc">Layered mountain silhouettes beneath a dark teal evening sky.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#12304a"/>
      <stop offset="0.46" stop-color="#0a1c31"/>
      <stop offset="1" stop-color="#020617"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.22" cy="0.12" r="0.68">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity="0.52"/>
      <stop offset="0.46" stop-color="#0f766e" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#020617" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ridgeBack" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#164e63"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="ridgeFront" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f2d3b"/>
      <stop offset="1" stop-color="#020617"/>
    </linearGradient>
    <filter id="soft" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="28"/>
    </filter>
  </defs>
  <rect width="1600" height="1000" fill="url(#sky)"/>
  <rect width="1600" height="1000" fill="url(#glow)"/>
  <ellipse cx="340" cy="160" rx="270" ry="120" fill="#5eead4" opacity="0.08" filter="url(#soft)"/>
  <path d="M0 650 190 530 340 588 510 410 680 566 820 470 980 590 1160 430 1320 548 1450 490 1600 620V1000H0Z" fill="url(#ridgeBack)" opacity="0.72"/>
  <path d="M0 760 220 620 380 690 600 520 780 720 930 610 1110 705 1300 575 1460 690 1600 630V1000H0Z" fill="url(#ridgeFront)"/>
  <path d="M0 860 240 735 470 820 700 690 940 825 1190 700 1390 790 1600 720V1000H0Z" fill="#020617" opacity="0.94"/>
</svg>
